# Build, test, and deploy static site + PWA to GitHub Pages (repo Pages URL uses /subtime/ base).
# Enable: Repo Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions tab → this workflow → "Run workflow"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture build metadata
        run: |
          echo "VITE_APP_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "VITE_APP_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      # Fail fast if Pages would serve dev index.html (e.g. branch deploy of repo root).
      - name: Verify bundle replaces dev entry
        run: |
          if grep -q '/src/main.tsx' dist/index.html || grep -q '/src/main.ts' dist/index.html; then
            echo 'dist/index.html still references /src/main — vite build did not transform entry.'
            exit 1
          fi

      - name: Install Playwright Chromium (system deps)
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e:ci

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
